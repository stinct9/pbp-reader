<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purushottam Bolya Prite — Bilingual Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Gujarati:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400..600&family=Inter:wght@400..600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f5; --panel:#fff; --ink:#26221e; --muted:#6c645b; --line:#e6e0d8;
  --accent:#8a1a1a; --accent-soft:#fdf2f2; --gu:#3d3630; --mark:#ffe9a8;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#17150f; --panel:#201d16; --ink:#ece6dc; --muted:#a49a8c; --line:#332e25;
  --accent:#e8a0a0; --accent-soft:#2a1e1e; --gu:#d8d0c4; --mark:#5a4a1a;}}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);
  font:16px/1.7 "Source Serif 4",Georgia,serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap;
  font-family:Inter,system-ui,sans-serif}
h1{font-size:15px;margin:0;color:var(--accent);font-weight:600;white-space:nowrap}
h1 span{color:var(--muted);font-weight:400}
button,select,input{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:7px;padding:6px 10px}
button{cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#q{flex:1;min-width:150px;max-width:340px}
.wrap{display:flex;max-width:1500px;margin:0 auto}
nav{width:270px;flex:none;border-right:1px solid var(--line);padding:14px 0 60px;
  position:sticky;top:47px;height:calc(100vh - 47px);overflow-y:auto;
  font-family:Inter,system-ui,sans-serif;font-size:13px}
nav a{display:block;padding:6px 16px;color:var(--ink);text-decoration:none;line-height:1.4}
nav a:hover{background:var(--accent-soft)}
nav a.sel{background:var(--accent-soft);color:var(--accent);font-weight:600;
  box-shadow:inset 3px 0 var(--accent)}
nav a b{display:block;font-weight:inherit}
nav a i{color:var(--muted);font-style:normal;font-size:12px;
  font-family:"Noto Serif Gujarati",serif}
main{flex:1;min-width:0;padding:28px 40px 140px;max-width:820px;margin:0 auto}
h2{font-size:27px;margin:.2em 0 .1em;color:var(--accent);font-weight:600;line-height:1.25}
h2 small{display:block;font-size:19px;color:var(--muted);font-weight:400;margin-top:6px;
  font-family:"Noto Serif Gujarati",serif}
.meta{color:var(--muted);font-size:13px;font-family:Inter,sans-serif;
  border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:26px}
.meta a{color:var(--muted)}
h3.sub{font-size:18px;margin:38px 0 14px;color:var(--ink);font-weight:600;
  font-family:"Noto Serif Gujarati",serif}
.appx{margin:46px 0 8px;padding-top:20px;border-top:2px solid var(--line);
  color:var(--accent);font-size:14px;letter-spacing:.09em;text-transform:uppercase;
  font-family:Inter,sans-serif;font-weight:600}
.blk{position:relative;margin:0 0 20px;padding:3px 0 3px 34px;border-radius:6px;cursor:pointer}
.blk:hover{background:var(--accent-soft)}
.blk.open{background:var(--accent-soft)}
.num{position:absolute;left:0;top:5px;font:500 11px/1 Inter,sans-serif;color:var(--muted);
  opacity:.55;font-variant-numeric:tabular-nums}
.blk.verse .en,.blk.verse .gu{margin-left:22px;font-style:italic;color:var(--accent)}
.gloss{display:block;margin:5px 0 0 22px;font-size:14.5px;color:var(--muted);font-style:normal}
.gu{font-family:"Noto Serif Gujarati",serif;color:var(--gu);font-size:16px;line-height:2}
.untr{color:var(--muted);font-style:italic;font-size:14px}
.orig{display:none;margin-top:11px;padding:12px 15px;background:var(--panel);
  border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.blk.open .orig{display:block}
.mtflag{display:inline-block;font:600 9.5px Inter,sans-serif;letter-spacing:.08em;
  text-transform:uppercase;color:#8a6a1a;background:#fdf6e3;border:1px solid #ecd9a8;
  border-radius:4px;padding:1px 5px;margin-right:7px;vertical-align:1px}
@media(prefers-color-scheme:dark){.mtflag{color:#d8bd7a;background:#2c2416;border-color:#4a3d22}}
.blk.mt .en{color:var(--muted)}
.srcv{margin-top:10px;padding:9px 12px;background:var(--bg);border-radius:6px;
  font-family:"Noto Serif Devanagari","Noto Serif Gujarati",serif;font-size:14px;
  line-height:1.95;color:var(--muted)}
.svlab{display:block;font:600 10px Inter,sans-serif;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent);margin-bottom:5px;font-family:Inter,sans-serif}
.src{margin-top:9px;font:500 11.5px Inter,sans-serif;color:var(--muted);letter-spacing:.03em}
mark{background:var(--mark);color:inherit;border-radius:2px}
.hits{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);margin-bottom:20px}
.hit{display:block;padding:11px 14px;margin-bottom:9px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;cursor:pointer}
.hit:hover{border-color:var(--accent)}
.hit .where{font:600 11px Inter,sans-serif;color:var(--accent);text-transform:uppercase;
  letter-spacing:.06em;display:block;margin-bottom:4px}
.hit p{margin:0;font-size:14.5px;line-height:1.6}
.tip{position:fixed;z-index:50;max-width:520px;padding:13px 16px;background:var(--panel);
  border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 30px rgba(0,0,0,.18);
  display:none;pointer-events:none}
.tip.show{display:block}
#menu{display:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:35;display:none}
#scrim.on{display:block}
.pager{display:flex;gap:10px;margin:52px 0 0;padding-top:20px;border-top:1px solid var(--line);
  font-family:Inter,system-ui,sans-serif;font-size:13px}
.pager a{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:8px;
  text-decoration:none;color:var(--ink);background:var(--panel);line-height:1.35}
.pager a:hover{border-color:var(--accent)}
.pager a span{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-bottom:3px}
.pager a.nx{text-align:right}
.pager a.ph{visibility:hidden}
@media(max-width:860px){
  #menu{display:block}
  header{padding:8px 12px;gap:8px}
  #q{flex:1 1 100%;max-width:none;min-width:0}
  #prog{display:none}
  nav{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);height:auto;
    z-index:40;transform:translateX(-101%);transition:transform .22s ease;
    background:var(--panel);padding:14px 0 40px;box-shadow:0 0 40px rgba(0,0,0,.3)}
  nav.open{transform:none}
  main{padding:20px 16px 100px}
  h1{font-size:14px;white-space:normal;flex:1;min-width:0}
  h1 span{display:none}
}
</style>
</head>
<body>
<header>
  <button id="menu" aria-label="Chapters">☰ Chapters</button>
  <h1>Purushottam Bolya Prite <span>· પુરુષોત્તમ બોલ્યા પ્રીતે</span></h1>
  <input id="q" placeholder="Search the English text…" autocomplete="off">
  <button id="mEn" class="on">English</button>
  <button id="mBo">Both</button>
  <button id="mGu">ગુજરાતી</button>
  <span id="prog" style="color:var(--muted);font-size:12px;font-family:Inter,sans-serif"></span>
</header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<div id="scrim"></div>
<div class="tip" id="tip"></div>
<script src="data.js"></script>
<script>
const D=window.PBP, nav=document.getElementById('nav'), main=document.getElementById('main'),
      tip=document.getElementById('tip'), q=document.getElementById('q');
const menu=document.getElementById('menu'), scrim=document.getElementById('scrim');
function drawer(on){nav.classList.toggle('open',on);scrim.classList.toggle('on',on);
  document.body.style.overflow=on?'hidden':''}
menu.onclick=()=>drawer(!nav.classList.contains('open'));
scrim.onclick=()=>drawer(false);
addEventListener('keydown',e=>{if(e.key==='Escape')drawer(false)});
let mode='en', cur=0;
document.getElementById('prog').textContent =
  D.careful+' reviewed · '+(D.translated-D.careful)+' machine · of '+D.translatable;

D.chapters.forEach((c,i)=>{
  const a=document.createElement('a'); a.href='#'; a.dataset.i=i;
  a.innerHTML='<b>'+(c.n?c.n+'. ':'')+esc(c.en||c.gu)+'</b><i>'+esc(c.gu)+'</i>';
  a.onclick=e=>{e.preventDefault();show(i);drawer(false);window.scrollTo(0,0)};
  nav.appendChild(a);
});
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

function show(i){
  cur=i; q.value='';
  [...nav.children].forEach((a,j)=>a.classList.toggle('sel',j===i));
  const c=D.chapters[i];
  let h='<h2>'+esc(c.en||c.gu)+'<small>'+esc(c.gu)+'</small></h2>'+
        '<div class="meta">'+(c.n?'Chapter '+c.n+' · ':'')+
        '<a href="'+c.url+'" target="_blank" rel="noopener">anirdesh.com source</a></div>';
  let ap=false;
  c.b.forEach(b=>{
    if(b.k==='heading'){
      if(b.a&&!ap){h+='<div class="appx">પરિશિષ્ટ · Appendix</div>';ap=true}
      h+='<h3 class="sub">'+esc(b.g)+'</h3>'; return;
    }
    h+=block(b);
  });
  h+=pager(i);
  main.innerHTML=h; wire();
  main.querySelectorAll('.pager a[data-i]').forEach(a=>a.onclick=e=>{
    e.preventDefault(); show(+a.dataset.i); window.scrollTo(0,0);
  });
}

function pager(i){
  const lab=j=>{const c=D.chapters[j];return esc((c.n?c.n+'. ':'')+(c.en||c.gu))};
  const prev=i>0
    ?'<a href="#" data-i="'+(i-1)+'"><span>← Previous</span>'+lab(i-1)+'</a>'
    :'<a class="ph">&nbsp;</a>';
  const next=i<D.chapters.length-1
    ?'<a class="nx" href="#" data-i="'+(i+1)+'"><span>Next →</span>'+lab(i+1)+'</a>'
    :'<a class="ph">&nbsp;</a>';
  return '<div class="pager">'+prev+next+'</div>';
}
function block(b,hl){
  const vs=b.k==='verse'?' verse':'';
  const src=b.s&&b.s.length?'<div class="src">HCS '+esc(b.s.join(', '))+'</div>':'';
  const sv=b.sv&&b.sv.length
    ?'<div class="srcv"><span class="svlab">source verse · Haricharitramrut Sagar</span>'+
      esc(b.sv.join('\n')).replace(/\n/g,'<br>')+'</div>':'';
  const guH='<div class="gu">'+mk(b.g,hl)+'</div>';
  const flag=b.mt?'<span class="mtflag" title="machine translation \u2014 not yet reviewed">machine</span>':'';
  const enH=b.e?'<div class="en">'+flag+mk(b.e,hl)+'</div>'+
              (b.gl?'<span class="gloss">'+esc(b.gl)+'</span>':'')
            :'<div class="untr">— not yet in English; the Gujarati is below —</div>';
  let body;
  if(mode==='gu')      body=guH+sv+src;
  else if(mode==='bo') body=enH+'<div class="orig" style="display:block">'+guH+sv+src+'</div>';
  else                 body=enH+'<div class="orig">'+guH+sv+src+'</div>';
  return '<div class="blk'+vs+(b.mt?' mt':'')+'" data-g="'+esc(b.g)+'" data-s="'+esc((b.s||[]).join(', '))+
         '" data-v="'+esc((b.sv||[]).join('\n'))+'"><span class="num">'+(b.i||'')+'</span>'+body+'</div>';
}
function mk(t,hl){
  t=esc(t);
  if(hl) t=t.replace(new RegExp('('+hl.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
  return t;
}

function wire(){
  main.querySelectorAll('.blk').forEach(el=>{
    el.onclick=()=>{ if(mode!=='en')return; el.classList.toggle('open') };
    if(mode!=='en')return;
    el.onmouseenter=e=>{
      if(el.classList.contains('open'))return;
      tip.innerHTML='<div class="gu">'+esc(el.dataset.g)+'</div>'+
        (el.dataset.v?'<div class="srcv"><span class="svlab">source verse</span>'+
          esc(el.dataset.v).replace(/\n/g,'<br>')+'</div>':'')+
        (el.dataset.s?'<div class="src">HCS '+esc(el.dataset.s)+'</div>':'');
      tip.classList.add('show'); place(e);
    };
    el.onmousemove=place;
    el.onmouseleave=()=>tip.classList.remove('show');
  });
}
function place(e){
  const r=tip.getBoundingClientRect();
  let x=e.clientX+18, y=e.clientY+18;
  if(x+r.width >innerWidth -12) x=e.clientX-r.width -18;
  if(y+r.height>innerHeight-12) y=Math.max(10,e.clientY-r.height-18);
  tip.style.left=x+'px'; tip.style.top=y+'px';
}

// ---- search (English, with Gujarati fallback) ----
let t0;
q.oninput=()=>{clearTimeout(t0);t0=setTimeout(run,180)};
function run(){
  const s=q.value.trim();
  if(s.length<2){show(cur);return}
  const rx=new RegExp(s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'), hits=[];
  D.chapters.forEach((c,ci)=>c.b.forEach(b=>{
    if(b.k==='heading')return;
    const t=(b.e||'')+' '+b.g;
    if(rx.test(t)) hits.push({ci,c,b});
  }));
  let h='<div class="hits">'+hits.length+' passage'+(hits.length==1?'':'s')+' matching “'+esc(s)+'”</div>';
  hits.slice(0,220).forEach(({ci,c,b})=>{
    const txt=b.e||b.g, i=txt.search(rx), a=Math.max(0,i-110);
    h+='<div class="hit" data-c="'+ci+'" data-i="'+b.i+'">'+
       '<span class="where">'+(c.n?c.n+'. ':'')+esc(c.en||c.gu)+' · ['+b.i+']</span><p'+
       (b.e?'':' class="gu"')+'>'+(a?'… ':'')+mk(txt.slice(a,a+300),s)+'…</p></div>';
  });
  main.innerHTML=h;
  main.querySelectorAll('.hit').forEach(el=>el.onclick=()=>{
    const id=el.dataset.i; show(+el.dataset.c);
    const t=[...main.querySelectorAll('.blk')].find(x=>x.querySelector('.num').textContent==id);
    if(t){t.scrollIntoView({block:'center'});t.classList.add('open')}
  });
}
for(const [id,m] of [['mEn','en'],['mBo','bo'],['mGu','gu']])
  document.getElementById(id).onclick=()=>{
    mode=m; ['mEn','mBo','mGu'].forEach(x=>document.getElementById(x).classList.toggle('on',x===id));
    tip.classList.remove('show'); q.value?run():show(cur);
  };
show(3);
</script>
</body>
</html>
