<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purushottam Bolya Prite — Bilingual Reader</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="PBP">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Gujarati:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400..600&family=Inter:wght@400..600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f5; --panel:#fff; --ink:#26221e; --muted:#6c645b; --line:#e6e0d8;
  --accent:#8a1a1a; --accent-soft:#fdf2f2; --gu:#3d3630; --mark:#ffe9a8;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#17150f; --panel:#201d16; --ink:#ece6dc; --muted:#a49a8c; --line:#332e25;
  --accent:#e8a0a0; --accent-soft:#2a1e1e; --gu:#d8d0c4; --mark:#5a4a1a;}}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);
  font:16px/1.7 "Source Serif 4",Georgia,serif;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap;
  font-family:Inter,system-ui,sans-serif}
h1{font-size:15px;margin:0;color:var(--accent);font-weight:600;white-space:nowrap}
h1 span{color:var(--muted);font-weight:400}
#sw{font:inherit;color:inherit;border:0;background:none;padding:4px 0;max-width:100%;text-overflow:ellipsis}
button,select,input{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:7px;padding:6px 10px}
button{cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#q{flex:1;min-width:150px;max-width:340px}
.wrap{display:flex;max-width:1500px;margin:0 auto}
nav{width:270px;flex:none;border-right:1px solid var(--line);padding:14px 0 60px;
  position:sticky;top:47px;height:calc(100vh - 47px);overflow-y:auto;
  font-family:Inter,system-ui,sans-serif;font-size:13px}
nav a{display:block;padding:6px 16px;color:var(--ink);text-decoration:none;line-height:1.4}
nav a:hover{background:var(--accent-soft)}
nav a.sel{background:var(--accent-soft);color:var(--accent);font-weight:600;
  box-shadow:inset 3px 0 var(--accent)}
nav a b{display:block;font-weight:inherit}
nav a i{color:var(--muted);font-style:normal;font-size:12px;
  font-family:"Noto Serif Gujarati",serif}
main{flex:1;min-width:0;padding:28px 40px 140px;max-width:820px;margin:0 auto}
h2{font-size:27px;margin:.2em 0 .1em;color:var(--accent);font-weight:600;line-height:1.25}
h2 small{display:block;font-size:19px;color:var(--muted);font-weight:400;margin-top:6px;
  font-family:"Noto Serif Gujarati",serif}
.meta{color:var(--muted);font-size:13px;font-family:Inter,sans-serif;
  border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:26px}
.meta a{color:var(--muted)}
h3.sub{font-size:18px;margin:38px 0 14px;color:var(--ink);font-weight:600;
  font-family:"Noto Serif Gujarati",serif}
.appx{margin:46px 0 8px;padding-top:20px;border-top:2px solid var(--line);
  color:var(--accent);font-size:14px;letter-spacing:.09em;text-transform:uppercase;
  font-family:Inter,sans-serif;font-weight:600}
.blk{position:relative;margin:0 0 20px;padding:3px 0 3px 34px;border-radius:6px;cursor:pointer}
.blk:hover{background:var(--accent-soft)}
.blk.open{background:var(--accent-soft)}
.num{position:absolute;left:0;top:5px;font:500 11px/1 Inter,sans-serif;color:var(--muted);
  opacity:.55;font-variant-numeric:tabular-nums}
.blk.verse .en,.blk.verse .gu{margin-left:22px;font-style:italic;color:var(--accent)}
.gloss{display:block;margin:5px 0 0 22px;font-size:14.5px;color:var(--muted);font-style:normal}
.gu{font-family:"Noto Serif Gujarati",serif;color:var(--gu);font-size:16px;line-height:2}
.untr{color:var(--muted);font-style:italic;font-size:14px}
.orig{display:none;margin-top:11px;padding:12px 15px;background:var(--panel);
  border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.blk.open .orig{display:block}
.mtflag{display:inline-block;font:600 9.5px Inter,sans-serif;letter-spacing:.08em;
  text-transform:uppercase;color:#8a6a1a;background:#fdf6e3;border:1px solid #ecd9a8;
  border-radius:4px;padding:1px 5px;margin-right:7px;vertical-align:1px}
@media(prefers-color-scheme:dark){.mtflag{color:#d8bd7a;background:#2c2416;border-color:#4a3d22}}
.blk.mt .en{color:var(--muted)}
.srcv{margin-top:10px;padding:9px 12px;background:var(--bg);border-radius:6px;
  font-family:"Noto Serif Devanagari","Noto Serif Gujarati",serif;font-size:14px;
  line-height:1.95;color:var(--muted)}
.svlab{display:block;font:600 10px Inter,sans-serif;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent);margin-bottom:5px;font-family:Inter,sans-serif}
.src{margin-top:9px;font:500 11.5px Inter,sans-serif;color:var(--muted);letter-spacing:.03em}
mark{background:var(--mark);color:inherit;border-radius:2px}
.hits{font-family:Inter,sans-serif;font-size:13px;color:var(--muted);margin-bottom:20px}
.hit{display:block;padding:11px 14px;margin-bottom:9px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;cursor:pointer}
.hit:hover{border-color:var(--accent)}
.hit .where{font:600 11px Inter,sans-serif;color:var(--accent);text-transform:uppercase;
  letter-spacing:.06em;display:block;margin-bottom:4px}
.hit p{margin:0;font-size:14.5px;line-height:1.6}
.bm{position:absolute;left:-5px;top:21px;width:30px;height:30px;padding:0;border:0;
  background:none;border-radius:50%;font:17px/30px system-ui,sans-serif;text-align:center;
  color:var(--muted);opacity:.3}
.blk:hover .bm{opacity:.75}
.bm.on{color:var(--accent);background:none;opacity:1}
@media(hover:none){.bm{opacity:.5}}
#mBm span{font-variant-numeric:tabular-nums}
.bmtools{display:flex;gap:8px;flex-wrap:wrap;margin:-10px 0 26px;font-family:Inter,sans-serif}
.bmcard{margin:0 0 30px;padding:14px 14px 12px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px}
.bmcard .where{font:600 11px Inter,sans-serif;color:var(--accent);text-transform:uppercase;
  letter-spacing:.06em;display:block;margin-bottom:8px}
.bmcard .where i{color:var(--muted);font-style:normal;font-weight:500;text-transform:none;letter-spacing:0}
.bmcard .blk{margin-bottom:10px}
.note{display:block;width:100%;min-height:58px;resize:vertical;margin:0 0 9px;
  font:14.5px/1.55 "Source Serif 4",Georgia,serif;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:7px;padding:8px 10px}
.bmact{display:flex;gap:8px;font-family:Inter,sans-serif}
.empty{color:var(--muted);font-style:italic}
.nudge{font-family:Inter,sans-serif;font-size:13.5px;line-height:1.55;background:var(--accent-soft);
  border-radius:8px;padding:10px 13px;margin:-8px 0 18px}
.recent{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;font-family:Inter,sans-serif;font-size:14px}
.recent a{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:9px 12px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;line-height:1.35}
.recent a:hover{border-color:var(--accent)}
.recent a span{color:var(--muted);font-size:12.5px}
.tip{position:fixed;z-index:50;max-width:min(520px,calc(100vw - 24px));padding:13px 16px;background:var(--panel);
  border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 30px rgba(0,0,0,.18);
  display:none;pointer-events:none}
.tip.show{display:block}
#menu{display:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:35;display:none}
#scrim.on{display:block}
.pager{display:flex;gap:10px;margin:52px 0 0;padding-top:20px;border-top:1px solid var(--line);
  font-family:Inter,system-ui,sans-serif;font-size:13px}
.pager a{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:8px;
  text-decoration:none;color:var(--ink);background:var(--panel);line-height:1.35}
.pager a:hover{border-color:var(--accent)}
.pager a span{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin-bottom:3px}
.pager a.nx{text-align:right}
.pager a.ph{visibility:hidden}
@media(max-width:860px){
  #menu{display:block}
  header{padding:8px 12px;gap:8px}
  #q{flex:1 1 100%;max-width:none;min-width:0}
  #prog{display:none}
  nav{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);height:auto;
    z-index:40;transform:translateX(-101%);transition:transform .22s ease;
    background:var(--panel);padding:14px 0 40px;box-shadow:0 0 40px rgba(0,0,0,.3)}
  nav.open{transform:none}
  main{padding:20px 16px 100px}
  h1{font-size:14px;white-space:normal;flex:1;min-width:0}
  h1 span{display:none}
}
</style>
</head>
<body>
<header>
  <button id="menu" aria-label="Chapters">☰ Chapters</button>
  <h1><select id="sw" aria-label="Choose what to read" onchange="if(this.value)location.href=this.value">
    <option value="" selected>Purushottam Bolya Prite</option>
    <option value="../kirtan/#ch">Cheshta ↗</option><option value="../kirtan/#cp">Chosath Padi ↗</option>
  </select></h1>
  <input id="q" placeholder="Search the English text…" autocomplete="off">
  <button id="mEn" class="on">English</button>
  <button id="mBo">Both</button>
  <button id="mGu">ગુજરાતી</button>
  <button id="mBm" title="Your bookmarked passages">★ Saved <span id="bmN"></span></button>
  <span id="prog" style="color:var(--muted);font-size:12px;font-family:Inter,sans-serif"></span>
</header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<div id="scrim"></div>
<div class="tip" id="tip"></div>
<script src="data.js"></script>
<script>
const D=window.PBP, nav=document.getElementById('nav'), main=document.getElementById('main'),
      tip=document.getElementById('tip'), q=document.getElementById('q');
const menu=document.getElementById('menu'), scrim=document.getElementById('scrim');
function drawer(on){nav.classList.toggle('open',on);scrim.classList.toggle('on',on);
  document.body.style.overflow=on?'hidden':''}
menu.onclick=()=>drawer(!nav.classList.contains('open'));
scrim.onclick=()=>drawer(false);
addEventListener('keydown',e=>{if(e.key==='Escape')drawer(false)});
let mode='en', cur=0, view='ch';
// Touch screens fake mouseenter on tap, which pinned the floating tooltip over the text.
// Only real hover devices get the tooltip; touch gets the inline tap-to-expand.
const HOVER=matchMedia('(hover: hover) and (pointer: fine)').matches;
const IDX={};   // block id -> {ci, b}
D.chapters.forEach((c,ci)=>c.b.forEach(b=>{if(b.i!=null&&b.k!=='heading')IDX[b.i]={ci,b}}));

// ---- bookmarks + reading history: kept in this browser only (localStorage); Back up / Restore moves them ----
// Every change re-reads storage first, so an old tab left open can't save its stale list over newer bookmarks.
const BK='pbp.bookmarks.v1', HIST='pbp.history.v1', BKUP='pbp.backup.v1';
const store={ok:true, list:[]};
function readList(k){
  try{ const v=JSON.parse(localStorage.getItem(k)||'[]'); store.ok=true; return Array.isArray(v)?v:[] }
  catch(e){ store.ok=false; return k===BK?store.list:[] }
}
function editBm(fn){
  store.list=readList(BK); fn(store.list);
  try{ localStorage.setItem(BK,JSON.stringify(store.list)); store.ok=true }catch(e){ store.ok=false }
  document.getElementById('bmN').textContent=store.list.length||'';
}
store.list=readList(BK);
const isBm=id=>store.list.some(x=>x.id===id);
function toggleBm(id){
  editBm(l=>{ const i=l.findIndex(x=>x.id===id); if(i>=0) l.splice(i,1); else l.push({id, t:Date.now(), note:''}) });
  // ask the browser not to clear our storage under pressure (harmless if refused)
  if(isBm(id)) try{ navigator.storage.persist() }catch(e){}
}
// another tab changed the bookmarks: pick them up here too
addEventListener('storage',e=>{
  if(e.key!==BK)return;
  store.list=readList(BK); document.getElementById('bmN').textContent=store.list.length||'';
  if(view==='bm'&&!main.contains(document.activeElement)) showBm(true);
});
// recently read: one entry per chapter, newest first, holding the last spot you were at
function noteHistory(h){
  const c=new URLSearchParams(h).get('c'); if(!c)return;
  const l=readList(HIST).filter(x=>x.c!==c); l.unshift({c,h,t:Date.now()});
  try{ localStorage.setItem(HIST,JSON.stringify(l.slice(0,30))) }catch(e){}
}
document.getElementById('bmN').textContent=store.list.length||'';
document.getElementById('prog').textContent =
  D.careful.toLocaleString()+' of '+D.translatable.toLocaleString()+' in English'+
  (D.translated>D.careful?' · '+(D.translated-D.careful)+' machine':'');

D.chapters.forEach((c,i)=>{
  const a=document.createElement('a'); a.href='#'; a.dataset.i=i;
  a.innerHTML='<b>'+(c.n?c.n+'. ':'')+esc(c.en||c.gu)+'</b><i>'+esc(c.gu)+'</i>';
  a.onclick=e=>{e.preventDefault();show(i);drawer(false);window.scrollTo(0,0)};
  nav.appendChild(a);
});
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

function show(i,quiet){
  cur=i; view='ch'; q.value=''; tip.classList.remove('show');
  if(!quiet) writeHash('c='+keyOf(i));
  [...nav.children].forEach((a,j)=>a.classList.toggle('sel',j===i));
  const c=D.chapters[i];
  let h='<h2>'+esc(c.en||c.gu)+'<small>'+esc(c.gu)+'</small></h2>'+
        '<div class="meta">'+(c.n?'Chapter '+c.n+' · ':'')+
        '<a href="'+c.url+'" target="_blank" rel="noopener">anirdesh.com source</a></div>';
  let ap=false;
  c.b.forEach(b=>{
    if(b.k==='heading'){
      if(b.a&&!ap){h+='<div class="appx">પરિશિષ્ટ · Appendix</div>';ap=true}
      h+='<h3 class="sub">'+esc(b.g)+'</h3>'; return;
    }
    h+=block(b);
  });
  h+=pager(i);
  main.innerHTML=h; wire();
  main.querySelectorAll('.pager a[data-i]').forEach(a=>a.onclick=e=>{
    e.preventDefault(); show(+a.dataset.i); window.scrollTo(0,0);
  });
}

function pager(i){
  const lab=j=>{const c=D.chapters[j];return esc((c.n?c.n+'. ':'')+(c.en||c.gu))};
  const prev=i>0
    ?'<a href="#" data-i="'+(i-1)+'"><span>← Previous</span>'+lab(i-1)+'</a>'
    :'<a class="ph">&nbsp;</a>';
  const next=i<D.chapters.length-1
    ?'<a class="nx" href="#" data-i="'+(i+1)+'"><span>Next →</span>'+lab(i+1)+'</a>'
    :'<a class="ph">&nbsp;</a>';
  return '<div class="pager">'+prev+next+'</div>';
}
function block(b,hl){
  const vs=b.k==='verse'?' verse':'';
  const src=b.s&&b.s.length?'<div class="src">HCS '+esc(b.s.join(', '))+'</div>':'';
  const sv=b.sv&&b.sv.length
    ?'<div class="srcv"><span class="svlab">source verse · Haricharitramrut Sagar</span>'+
      esc(b.sv.join('\n')).replace(/\n/g,'<br>')+'</div>':'';
  const guH='<div class="gu">'+mk(b.g,hl)+'</div>';
  const flag=b.mt?'<span class="mtflag" title="machine translation \u2014 not yet carefully translated">machine</span>':'';
  const enH=b.e?'<div class="en">'+flag+mk(b.e,hl)+'</div>'+
              (b.gl?'<span class="gloss">'+esc(b.gl)+'</span>':'')
            :'<div class="untr">— not yet in English; the Gujarati is below —</div>';
  let body;
  if(mode==='gu')      body=guH+sv+src;
  else if(mode==='bo') body=enH+'<div class="orig" style="display:block">'+guH+sv+src+'</div>';
  else                 body=enH+'<div class="orig">'+guH+sv+src+'</div>';
  const on=isBm(b.i);
  const star='<button class="bm'+(on?' on':'')+'" aria-label="'+(on?'Remove bookmark':'Bookmark this passage')+
             '" title="'+(on?'Remove bookmark':'Bookmark')+'">'+(on?'★':'☆')+'</button>';
  return '<div class="blk'+vs+(b.mt?' mt':'')+'" data-id="'+b.i+'" data-g="'+esc(b.g)+'" data-s="'+esc((b.s||[]).join(', '))+
         '" data-v="'+esc((b.sv||[]).join('\n'))+'"><span class="num">'+(b.i||'')+'</span>'+star+body+'</div>';
}
function mk(t,hl){
  t=esc(t);
  if(hl) t=t.replace(new RegExp('('+hl.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');
  return t;
}

function wire(){
  main.querySelectorAll('.blk').forEach(el=>{
    const s=el.querySelector('.bm');
    s.onclick=e=>{
      e.stopPropagation(); const id=+el.dataset.id; toggleBm(id);
      if(view==='bm'){showBm();return}
      const on=isBm(id); s.classList.toggle('on',on); s.textContent=on?'★':'☆';
      s.title=on?'Remove bookmark':'Bookmark'; s.setAttribute('aria-label',on?'Remove bookmark':'Bookmark this passage');
    };
    el.onclick=()=>{ if(mode!=='en')return; tip.classList.remove('show'); el.classList.toggle('open') };
    if(mode!=='en'||!HOVER)return;
    el.onmouseenter=e=>{
      if(el.classList.contains('open'))return;
      tip.innerHTML='<div class="gu">'+esc(el.dataset.g)+'</div>'+
        (el.dataset.v?'<div class="srcv"><span class="svlab">source verse</span>'+
          esc(el.dataset.v).replace(/\n/g,'<br>')+'</div>':'')+
        (el.dataset.s?'<div class="src">HCS '+esc(el.dataset.s)+'</div>':'');
      tip.classList.add('show'); place(e);
    };
    el.onmousemove=place;
    el.onmouseleave=()=>tip.classList.remove('show');
  });
}
function place(e){
  const r=tip.getBoundingClientRect();
  let x=e.clientX+18, y=e.clientY+18;
  if(x+r.width >innerWidth -12) x=e.clientX-r.width -18;
  if(y+r.height>innerHeight-12) y=Math.max(10,e.clientY-r.height-18);
  x=Math.max(12,Math.min(x,innerWidth-r.width-12));   // never off either edge
  tip.style.left=x+'px'; tip.style.top=y+'px';
}

function goTo(id){
  const e=IDX[id]; if(!e)return;
  show(e.ci);
  const t=main.querySelector('.blk[data-id="'+id+'"]');
  if(!t)return;
  if(mode==='en')t.classList.add('open');
  scrollToBlk(t); savePlace();
}
// land a passage's first line just below the sticky header (tall on phones)
function scrollToBlk(t){
  const hh=document.querySelector('header').offsetHeight;
  window.scrollTo(0, t.getBoundingClientRect().top+scrollY-hh-12);
}

// ---- remembering your place: the address carries #c=<chapter>&p=<passage> (or #saved),
// so a refresh, a phone reloading a sleeping tab, or the back button lands where you were.
// The last place is also kept in this browser, for when the reader is opened fresh.
const LAST='pbp.last.v1';
history.scrollRestoration='manual';
function keyOf(i){const c=D.chapters[i];return c.n?String(c.n):'x'+i}
function idxOf(k){
  if(!k)return -1;
  if(k[0]==='x'){const i=+k.slice(1);return D.chapters[i]?i:-1}
  return D.chapters.findIndex(c=>String(c.n)===k);
}
function writeHash(h){
  if(location.hash==='#'+h)return;
  // a new page (chapter / Saved) is a history step; moving within a page just updates it
  const page=x=>x.split('&')[0], push=page(location.hash.slice(1))!==page(h);
  try{ history[push?'pushState':'replaceState'](null,'','#'+h) }catch(e){}
  try{ localStorage.setItem(LAST,h) }catch(e){}
  noteHistory(h);
}
function topBlk(){
  if(view!=='ch')return null;
  const hh=document.querySelector('header').offsetHeight;
  for(const b of main.querySelectorAll('.blk'))
    if(b.getBoundingClientRect().bottom>hh+8) return +b.dataset.id;
  return null;
}
function savePlace(){
  if(view!=='ch')return;
  const id=scrollY>60?topBlk():null;
  writeHash('c='+keyOf(cur)+(id?'&p='+id:''));
}
let tScroll;
addEventListener('scroll',()=>{clearTimeout(tScroll);tScroll=setTimeout(savePlace,250)},{passive:true});
// phones may later reload a backgrounded tab — record the spot the moment it's hidden
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')savePlace()});
addEventListener('pagehide',savePlace);
function route(){
  let h=location.hash.slice(1);
  if(!h){ try{h=localStorage.getItem(LAST)||''}catch(e){} }
  if(h==='saved'){ showBm(true); }
  else{
    const p=new URLSearchParams(h), i=idxOf(p.get('c'));
    if(i<0){ h='c='+keyOf(3); show(3,true); window.scrollTo(0,0); }
    else{
      show(i,true);
      const t=main.querySelector('.blk[data-id="'+(+p.get('p')||-1)+'"]');
      t?scrollToBlk(t):window.scrollTo(0,0);
    }
  }
  try{ history.replaceState(null,'','#'+h) }catch(e){}
  try{ localStorage.setItem(LAST,h) }catch(e){}
  noteHistory(h);
}
addEventListener('popstate',route);

function chLabel(ci){const c=D.chapters[ci];return (c.n?c.n+'. ':'')+(c.en||c.gu)}
function ago(t){
  const d=Math.floor((Date.now()-t)/864e5);
  return d<1?'today':d<2?'yesterday':d+' days ago';
}
function showBm(quiet){
  view='bm'; q.value=''; tip.classList.remove('show');
  if(!quiet) writeHash('saved');
  [...nav.children].forEach(a=>a.classList.remove('sel'));
  store.list=readList(BK);
  const L=[...store.list].sort((a,b)=>b.t-a.t), H=readList(HIST).filter(x=>idxOf(x.c)>=0).slice(0,8);
  let last=0; try{ last=+localStorage.getItem(BKUP)||0 }catch(e){}
  const stale=L.length&&(!last||Date.now()-last>30*864e5);
  let h='<h2>Saved passages<small>Your bookmarks, notes and recent reading</small></h2>'+
    '<div class="meta">'+L.length+' saved · kept in this browser on this device only · '+
    (last?'last backed up '+ago(last):'not backed up yet')+'</div>'+
    (stale?'<p class="nudge">Browsers sometimes clear saved data, so it’s worth keeping a copy. <b>Back up</b> saves a small file you can keep in Files, iCloud or Notes; <b>Restore</b> brings it back on any device.</p>':'')+
    '<div class="bmtools"><button id="bmEx">Back up</button><button id="bmIm">Restore…</button>'+
    '<input type="file" id="bmFile" accept=".json,application/json" hidden></div>';
  if(!store.ok) h+='<p class="empty">This browser is blocking storage (private mode?), so bookmarks won’t be kept after you close the page.</p>';
  if(H.length){
    h+='<h3 class="sub">Recently read</h3><div class="recent">';
    H.forEach(x=>{
      const ci=idxOf(x.c), p=new URLSearchParams(x.h).get('p');
      h+='<a href="#'+esc(x.h)+'" data-h="'+esc(x.h)+'">'+esc(chLabel(ci))+
         '<span>'+(p?'at ['+esc(p)+'] · ':'')+ago(x.t)+'</span></a>';
    });
    h+='</div><h3 class="sub">Bookmarks</h3>';
  }
  if(!L.length) h+='<p class="empty">Nothing saved yet. Tap the ☆ beside any passage to keep it here.</p>';
  L.forEach(x=>{
    const e=IDX[x.id];
    const when=new Date(x.t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
    h+='<div class="bmcard" data-id="'+x.id+'"><span class="where">'+
       (e?esc(chLabel(e.ci)):'Passage')+' · ['+x.id+'] <i>· saved '+when+'</i></span>'+
       (e?block(e.b):'<p class="empty">This passage is no longer in the book data.</p>')+
       '<textarea class="note" placeholder="Your note — what you took from this…">'+esc(x.note||'')+'</textarea>'+
       '<div class="bmact">'+(e?'<button data-go>Read in chapter</button>':'')+'<button data-rm>Remove</button></div></div>';
  });
  main.innerHTML=h; wire(); window.scrollTo(0,0);
  main.querySelectorAll('.recent a').forEach(a=>a.onclick=e=>{
    e.preventDefault(); try{ history.pushState(null,'','#'+a.dataset.h) }catch(_){} route();
  });
  main.querySelectorAll('.bmcard').forEach(card=>{
    const id=+card.dataset.id, ta=card.querySelector('.note');
    const setNote=()=>editBm(l=>{const x=l.find(y=>y.id===id); if(x)x.note=ta.value});
    let tn; ta.oninput=()=>{clearTimeout(tn);tn=setTimeout(setNote,300)};
    ta.onblur=()=>{const x=store.list.find(y=>y.id===id); if(x&&x.note!==ta.value)setNote()};
    const go=card.querySelector('[data-go]'); if(go)go.onclick=()=>goTo(id);
    card.querySelector('[data-rm]').onclick=()=>{editBm(l=>{const i=l.findIndex(y=>y.id===id); if(i>=0)l.splice(i,1)});showBm(true)};
  });
  document.getElementById('bmEx').onclick=exportBm;
  const f=document.getElementById('bmFile');
  document.getElementById('bmIm').onclick=()=>f.click();
  f.onchange=()=>{const file=f.files[0]; if(file)file.text().then(importBm)};
}
// Back up: the share sheet on phones (save to Files / iCloud / Notes), a download elsewhere
async function exportBm(){
  store.list=readList(BK);
  const out={app:'pbp-reader',version:2,exported:new Date().toISOString(),
    bookmarks:store.list.map(x=>{const e=IDX[x.id];return {id:x.id,t:x.t,note:x.note||'',
      chapter:e?chLabel(e.ci):null, english:e?(e.b.e||null):null, gujarati:e?e.b.g:null}}),
    history:readList(HIST)};
  const name='pbp-bookmarks-'+new Date().toISOString().slice(0,10)+'.json';
  const file=new File([JSON.stringify(out,null,1)],name,{type:'application/json'});
  const done=()=>{ try{ localStorage.setItem(BKUP,String(Date.now())) }catch(e){} showBm(true) };
  if(navigator.canShare&&navigator.canShare({files:[file]}))
    try{ await navigator.share({files:[file],title:'PBP bookmarks'}); done(); return }
    catch(e){ if(e.name==='AbortError')return }   // cancelled; anything else falls back to download
  const a=document.createElement('a');
  a.href=URL.createObjectURL(file); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  done();
}
function importBm(text){
  let arr, hist=[];
  try{ const d=JSON.parse(text); arr=Array.isArray(d)?d:d.bookmarks; if(!Array.isArray(arr))throw 0;
       if(Array.isArray(d.history))hist=d.history }
  catch(e){ alert('That file doesn’t look like a bookmarks backup.'); return }
  let added=0;
  editBm(l=>arr.forEach(x=>{
    const id=+x.id; if(!Number.isFinite(id))return;
    const have=l.find(y=>y.id===id);
    if(!have){l.push({id,t:+x.t||Date.now(),note:String(x.note||'')});added++}
    else if(!have.note&&x.note) have.note=String(x.note);
  }));
  // history: keep the newest entry per chapter from either side
  const byC={};
  [...readList(HIST),...hist].forEach(x=>{
    if(x&&typeof x.c==='string'&&typeof x.h==='string'&&+x.t&&!(byC[x.c]&&byC[x.c].t>=+x.t)) byC[x.c]={c:x.c,h:x.h,t:+x.t};
  });
  try{ localStorage.setItem(HIST,JSON.stringify(Object.values(byC).sort((a,b)=>b.t-a.t).slice(0,30))) }catch(e){}
  showBm(true);
  alert(added+' bookmark'+(added==1?'':'s')+' added'+(arr.length>added?' ('+(arr.length-added)+' already here)':'')+'.');
}

// ---- search (English, with Gujarati fallback) ----
let t0;
q.oninput=()=>{clearTimeout(t0);t0=setTimeout(run,180)};
function run(){
  const s=q.value.trim();
  if(s.length<2){show(cur);return}
  const rx=new RegExp(s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'), hits=[];
  D.chapters.forEach((c,ci)=>c.b.forEach(b=>{
    if(b.k==='heading')return;
    const t=(b.e||'')+' '+b.g;
    if(rx.test(t)) hits.push({ci,c,b});
  }));
  let h='<div class="hits">'+hits.length+' passage'+(hits.length==1?'':'s')+' matching “'+esc(s)+'”</div>';
  hits.slice(0,220).forEach(({ci,c,b})=>{
    const txt=b.e||b.g, i=txt.search(rx), a=Math.max(0,i-110);
    h+='<div class="hit" data-c="'+ci+'" data-i="'+b.i+'">'+
       '<span class="where">'+(c.n?c.n+'. ':'')+esc(c.en||c.gu)+' · ['+b.i+']</span><p'+
       (b.e?'':' class="gu"')+'>'+(a?'… ':'')+mk(txt.slice(a,a+300),s)+'…</p></div>';
  });
  main.innerHTML=h;
  main.querySelectorAll('.hit').forEach(el=>el.onclick=()=>goTo(+el.dataset.i));
}
const MODES=[['mEn','en'],['mBo','bo'],['mGu','gu']];
function setMode(m){
  mode=m; MODES.forEach(([x,y])=>document.getElementById(x).classList.toggle('on',y===m));
  try{ localStorage.setItem('pbp.mode',m) }catch(e){}
}
for(const [id,m] of MODES)
  document.getElementById(id).onclick=()=>{
    const keep=topBlk();          // switching view keeps the same passage at the top
    setMode(m); tip.classList.remove('show');
    if(q.value){run();return}
    if(view==='bm'){showBm(true);return}
    show(cur,true);
    const t=keep&&main.querySelector('.blk[data-id="'+keep+'"]');
    if(t)scrollToBlk(t);
  };
document.getElementById('mBm').onclick=()=>{drawer(false);showBm()};
try{ const m=localStorage.getItem('pbp.mode'); if(m==='en'||m==='bo'||m==='gu') setMode(m) }catch(e){}
route();
